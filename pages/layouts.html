<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../main.css" rel="stylesheet" type="text/css"/>
    <script src="../script/main.js"></script>
    <title>Document</title>
</head>
<body>
    <a href="../index.html"><button id="backBtn">&lt; Back</button></a>
    <div id="layoutControls" class="layoutContainer">
        <div>
            <span id="layoutPaletteTitle">INSERT HEX CODES: </span>
            <input type="text" maxlength="42" id="layoutPaletteInput" placeholder="No spaces - separate by commas eg. #ABCDEF,#123456,#GHIJKL etc..">
            <button>GENERATE</button>
        </div>
    </div>
    <div id="layoutResults" class="layoutContainer">
        <div id="layoutConstructInput">
            <input type="radio" name="layout" class="chooseLayout" id="standard" value="Standard">
            <label for="standard">Standard</label>
            <input type="radio" name="layout" class="chooseLayout" id="brochure" value="Brochure">
            <label for="brochure">Brochure</label>
            <input type="radio" name="layout" class="chooseLayout" id="illustrative" value="Illustrative">
            <label for="illustrative">Illustrative</label>
            <input type="radio" name="layout" class="chooseLayout" id="newsletter" value="Newsletter">
            <label for="newsletter">Newsletter</label>
            <input type="radio" name="layout" class="chooseLayout" id="action" value="Action">
            <label for="action">Action</label>
            <input type="radio" name="layout" class="chooseLayout" id="email" value="Email">
            <label for="email">Email</label>
            <input type="radio" name="layout" class="chooseLayout" id="mobile" value="Mobile">
            <label for="mobile">Mobile</label>
            <input type="radio" name="layout" class="chooseLayout" id="commerce" value="Commerce">
            <label for="commerce">Commerce</label>
        </div>
    


        <div id="carousel">

            <span>Back</span>

            <div id="templateContainer">

                <div id="standardTemplate" class="template">
                    <div class="tempHead tempObj fourth"><span class="tempTitle third">Header</span></div>
                    <div class="tempHero tempObj first"><span class="tempTitle third">Hero Section</span></div>
                    <div class="tempBody tempObj second"></div>
                    <div class="tempFoot tempObj fifth"></div>
                </div>
                
            </div>

            <span>Next</span>

        </div>



    </div>
</body>
</html>
