<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../main.css" rel="stylesheet" type="text/css"/>
    <script src="../script/layouts.js" type="module"></script>
    <title>Document</title>
</head>
<body id="layoutPage">
    <a href="../index.html"><button id="backBtn">&lt; Back</button></a>
    <div id="layoutControls" class="layoutContainer">
        <div>
            <span id="layoutPaletteTitle">INSERT HEX CODES: </span>
            <input type="text" maxlength="39" id="layoutPaletteInput" placeholder="no spaces - separate by commas eg. #ABCDEF,#123456,#GHIJKL etc..">
            <button id="generateLayoutBtn">GENERATE</button>
        </div>
    </div>
    <div id="layoutResults" class="layoutContainer">
        <div id="layoutConstructInput">
            <input type="radio" name="layout" class="chooseLayout" id="standard" value="standard" checked>
            <label for="standard">Standard</label>
            <input type="radio" name="layout" class="chooseLayout" id="brochure" value="brochure">
            <label for="brochure">Brochure</label>
            <input type="radio" name="layout" class="chooseLayout" id="illustrative" value="illustrative">
            <label for="illustrative">Illustrative</label>
            <input type="radio" name="layout" class="chooseLayout" id="newsletter" value="newsletter">
            <label for="newsletter">Newsletter</label>
            <input type="radio" name="layout" class="chooseLayout" id="action" value="action">
            <label for="action">Action</label>
            <input type="radio" name="layout" class="chooseLayout" id="blend" value="blend">
            <label for="blend">Blend<label>
            <!-- <input type="radio" name="layout" class="chooseLayout" id="email" value="Email">
            <label for="email">Email</label>
            <input type="radio" name="layout" class="chooseLayout" id="mobile" value="Mobile">
            <label for="mobile">Mobile</label>
            <input type="radio" name="layout" class="chooseLayout" id="commerce" value="Commerce">
            <label for="commerce">Commerce</label> -->
        </div>
    


        <div id="carousel">

            <div id="templateContainer">

                <div id="standardTemplate" class="template">
                    <div class="tempHead tempObj fourth"><span class="tempTitle tempObj third">Header</span></div>
                    <div class="tempHero tempObj first"><span class="tempTitle tempObj third">Hero Section</span></div>
                    <div class="tempBody tempObj second">Body</div>
                    <div class="tempFoot tempObj fifth">Footer</div>
                </div>

                <div id="brochureTemplate" class="template hidden">
                    <div class="tempHead tempObj fourth"><span class="tempTitle tempObj third"></span></div>
                    <div class="tempHero tempObj first"><span class="tempTitle tempObj third">Hero Section</span></div>
                    <div id="firstPage" class="tempBody tempObj second"></div>
                    <div id="secondPage" class="tempBody tempObj second">Body</div>
                    <div id="thirdPage" class="tempBody tempObj second">Body</div>
                    <div class="tempFoot tempObj fifth"></div>
                </div>

                <div id="illustrativeTemplate" class="template hidden">
                    <div class="tempHead tempObj fourth"><span class="tempTitle tempObj third"></span></div>
                    <div class="tempHero tempObj first"><span class="tempTitle tempObj third">Hero Section</span></div>
                    <div class="tempBody tempObj second">Body</div>
                    <div class="tempFoot tempObj fifth"></div>
                </div>

                <div id="newsletterTemplate" class="template hidden">
                    <div class="tempHead tempObj fourth"><span class="tempTitle tempObj third">Header</span></div>
                    <div class="tempHero tempObj first"><span class="tempTitle tempObj third">Hero Section</span></div>
                    <div class="tempBody tempObj second">Body</div>
                    <div class="tempFoot tempObj fifth">Footer</div>
                </div>

                <div id="actionTemplate" class="template hidden">
                    <div class="tempHero tempObj first"><span class="tempTitle tempObj third">Hero Section</span></div>
                    <div class="tempAction tempObj second">Action</div>
                </div>

                <div id="blendTemplate" class="template hidden">
                    <div class="tempHero tempObj first"><span class="tempTitle tempObj third">Hero Section</span></div>
                </div>
                
            </div>

        </div>



    </div>
</body>
</html>
