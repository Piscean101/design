<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palettes</title>
    <script src="../script/main.js" type="module"></script>
    <link href="../main.css" rel="stylesheet" type="text/css"/>
</head>
<body>
    <a href="../index.html"><button id="backBtn">&lt; Back</button></a>
    <div id="filter">
        <h5>FILTER BY COLOR</h5>
        <input type="radio" name="colorFilter" class="colorFilter" id="All" value="All" checked>
        <label for="All">All</label>
        <input type="radio" name="colorFilter" class="colorFilter" id="Red" value="Red">
        <label for="Red">Red</label>
        <input type="radio" name="colorFilter" class="colorFilter" id="Orange" value="Orange">
        <label for="Orange">Orange</label>
        <input type="radio" name="colorFilter" class="colorFilter" id="Yellow" value="Yellow">
        <label for="Yellow">Yellow</label>
        <input type="radio" name="colorFilter" class="colorFilter" id="Green" value="Green">
        <label for="Green">Green</label>
        <input type="radio" name="colorFilter" class="colorFilter" id="Blue" value="Blue">
        <label for="Blue">Blue</label>
        <input type="radio" name="colorFilter" class="colorFilter" id="Purple" value="Purple">
        <label for="Purple">Purple</label>
        <input type="radio" name="colorFilter" class="colorFilter" id="Pink" value="Pink">
        <label for="Pink">Pink</label>
        <input type="radio" name="colorFilter" class="colorFilter" id="Beige" value="Beige">
        <label for="Beige">Beige</label>
        <input type="radio" name="colorFilter" class="colorFilter" id="Grey" value="Grey">
        <label for="Grey">Grey</label>
        <input type="radio" name="colorFilter" class="colorFilter" id="White" value="White">
        <label for="White">White</label>
    </div>
    
</body>
</html>
